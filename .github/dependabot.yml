# Renovate opens version updates, so `open-pull-requests-limit: 0` leaves Dependabot only security
# updates. The entry sets its commit type, which Dependabot would otherwise infer from recent
# commits, and its label, which drops the ecosystem label Dependabot adds by default.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
